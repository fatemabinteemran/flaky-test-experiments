name: Python Test Collection (Pilot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-collection:
    name: collect-${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: autogpt
            repository: Significant-Gravitas/AutoGPT
            sha: 39856ae4533ce7025647dfc6e899a1c56f1324e5
            workdir: source/autogpt_platform/backend
          - project: skyvern
            repository: Skyvern-AI/skyvern
            sha: dca0f98fe76cbb4bb0e7824c53dffe8a26ac68fb
            workdir: source

    steps:
      - name: Checkout research workflow repository
        uses: actions/checkout@v4

      - name: Checkout specified research commit
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record pinned environment and prepare output
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          REPO: ${{ matrix.repository }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          {
            echo "project=$PROJECT"
            echo "repository=$REPO"
            echo "expected_sha=$EXPECTED_SHA"
            echo "actual_sha=$ACTUAL_SHA"
            echo "utc=$(date -u +%FT%TZ)"
            echo "runner_image=$ImageOS $ImageVersion"
            uname -a
            python --version
            python -m pip --version
            echo "cpu_count=$(nproc)"
            free -h
            df -h .
          } > artifacts/environment.txt
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Prepare exact-nodeid pytest collection plugin
        shell: bash
        run: |
          cat > research_pytest_export.py <<'PY'
          import collections
          import csv
          import json
          import os
          from pathlib import Path

          def pytest_collectreport(report):
              if report.failed:
                  path = Path(os.environ['RESEARCH_ERRORS_PATH'])
                  with path.open('a', encoding='utf-8') as f:
                      f.write(json.dumps({
                          'nodeid': report.nodeid,
                          'error': str(report.longrepr),
                      }, ensure_ascii=False) + '\n')

          def pytest_collection_finish(session):
              items = session.items
              output = Path(os.environ['RESEARCH_INVENTORY_PATH'])
              sha = os.environ['RESEARCH_EXPECTED_SHA']
              counts = collections.Counter(item.nodeid for item in items)
              with output.open('w', newline='', encoding='utf-8') as f:
                  writer = csv.writer(f)
                  writer.writerow(['test_id', 'test_name', 'module', 'sha'])
                  for item in items:
                      nodeid = item.nodeid
                      module, sep, test_name = nodeid.partition('::')
                      writer.writerow([nodeid, test_name if sep else item.name, module, sha])
              duplicates = {nodeid: count for nodeid, count in counts.items() if count > 1}
              Path(os.environ['RESEARCH_SUMMARY_PATH']).write_text(
                  json.dumps({
                      'collected_items': len(items),
                      'unique_nodeids': len(counts),
                      'duplicate_nodeids': duplicates,
                      'note': 'IDs are native pytest nodeids; plugin is collection-only.',
                  }, indent=2, ensure_ascii=False),
                  encoding='utf-8',
              )
          PY

      - name: Install project test dependencies
        id: install
        continue-on-error: true
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -uo pipefail
          cd '${{ matrix.workdir }}'
          if [ "$PROJECT" = "autogpt" ]; then
            python -m pip install 'poetry==2.2.1' > "$GITHUB_WORKSPACE/artifacts/tool-install.log" 2>&1
            tool_rc=$?
            if [ "$tool_rc" -eq 0 ]; then
              timeout 3300s poetry install --no-interaction --with dev > "$GITHUB_WORKSPACE/artifacts/dependency-install.log" 2>&1
              rc=$?
            else
              echo "Poetry installation failed (exit $tool_rc)" > "$GITHUB_WORKSPACE/artifacts/dependency-install.log"
              rc=$tool_rc
            fi
          else
            python -m pip install uv > "$GITHUB_WORKSPACE/artifacts/tool-install.log" 2>&1
            tool_rc=$?
            if [ "$tool_rc" -eq 0 ]; then
              timeout 3300s uv sync --locked --group dev --python "$(command -v python)" > "$GITHUB_WORKSPACE/artifacts/dependency-install.log" 2>&1
              rc=$?
            else
              echo "uv installation failed (exit $tool_rc)" > "$GITHUB_WORKSPACE/artifacts/dependency-install.log"
              rc=$tool_rc
            fi
          fi
          echo "exit_code=$rc" > "$GITHUB_WORKSPACE/artifacts/install-status.txt"
          exit "$rc"

      - name: Collect native pytest test identifiers
        id: collect
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          RESEARCH_EXPECTED_SHA: ${{ matrix.sha }}
          RESEARCH_INVENTORY_PATH: ${{ github.workspace }}/artifacts/test-inventory.csv
          RESEARCH_ERRORS_PATH: ${{ github.workspace }}/artifacts/collection-errors.jsonl
          RESEARCH_SUMMARY_PATH: ${{ github.workspace }}/artifacts/collection-summary.json
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -uo pipefail
          cd '${{ matrix.workdir }}'
          if [ "$PROJECT" = "autogpt" ]; then
            timeout 1800s poetry run python -m pytest -p research_pytest_export --collect-only -q --continue-on-collection-errors > "$GITHUB_WORKSPACE/artifacts/collection.log" 2>&1
            rc=$?
          else
            timeout 1800s uv run --no-sync python -m pytest -p research_pytest_export --collect-only -q --continue-on-collection-errors > "$GITHUB_WORKSPACE/artifacts/collection.log" 2>&1
            rc=$?
          fi
          echo "exit_code=$rc" > "$GITHUB_WORKSPACE/artifacts/collection-status.txt"
          exit "$rc"

      - name: Upload audit logs and inventories (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pilot-${{ matrix.project }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Reflect true installation/collection status
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          echo "install=$INSTALL_OUTCOME; collection=$COLLECT_OUTCOME"
          test "$INSTALL_OUTCOME" = success && test "$COLLECT_OUTCOME" = success
